name: APK de Android

# Compila el APK de Reservitta en la nube (no depende de ninguna computadora) y lo deja
# descargable en la pestaña "Actions" > ejecución > "Artifacts".
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  apk:
    environment: Resend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # La misma versión con la que se desarrolla el proyecto: una más nueva puede exigir
          # otro Android Gradle Plugin y romper la compilación.
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      # El archivo .env no se sube a git (es local); la app lo declara como recurso, así
      # que se crea con los secrets para compilar. No contiene claves de Firebase: esas van en
      # lib/firebase_options.dart y android/app/google-services.json.
      - name: Verificar RESEND_API_KEY en secrets (sin exponer valor)
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_KEY" ]; then
            echo "::error::RESEND_API_KEY llegó vacía desde el environment Resend (revisa Secrets/Variables del environment o Deployment branches)."
            exit 1
          fi

      - name: Crear .env con secrets
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
        run: |
          printf 'RESEND_API_KEY=%s\n' "$RESEND_KEY" > .env

      - run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Compilar APK de producción
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
        run: flutter build apk --release --dart-define="RESEND_API_KEY=$RESEND_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: reservitta-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
